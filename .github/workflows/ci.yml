name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check links, metadata and assets
        run: node scripts/check-site.mjs

      - name: Validate HTML
        run: npx --yes html-validate@9 "*.html"
